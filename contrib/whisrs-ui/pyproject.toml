[project]
name = "whisrs-ui"
version = "0.1.0"
description = "A desktop window for whisrs: settings, history, recovery and commands"
requires-python = ">=3.12"
dependencies = [
    "pywebview>=5.3",
    "tomlkit>=0.13",
]

[project.scripts]
whisrs-ui = "whisrs_ui.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whisrs_ui"]
